name: Ошибка или недоработка
description: Мод работает неправильно, вызывает вылет игры или отображается некорректно
labels: ["баг", "статус: новый"]
body:
  - type: markdown
    attributes:
      value: |
        Чем подробнее отчёт, тем быстрее удастся найти причину. Обязательно приложите `python.log` — он находится в корне папки с игрой, рядом с `Tanki.exe` или `WorldOfTanks.exe`.

  - type: checkboxes
    id: checks
    attributes:
      label: Перед отправкой
      options:
        - label: "Такой ошибки ещё нет в [списке](https://github.com/kostikmalish/hangar-studio-feedback/issues?q=is%3Aissue%20label%3A%D0%B1%D0%B0%D0%B3) — ни среди открытых, ни среди закрытых"
          required: true
        - label: Установлена последняя версия мода
          required: true

  - type: dropdown
    id: region
    attributes:
      label: Регион
      options:
        - Мир Танков (Lesta Games)
        - World of Tanks (Wargaming)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Раздел мода
      options:
        - Каталог ангаров
        - Любая карта как ангар (расстановка)
        - Режим настройки в ангаре
        - Полноэкранный режим
        - Компактный режим
        - Кнопка и список модификаций
        - Установка, запуск или вылет игры
        - Другое / не знаю
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: Как часто повторяется
      options:
        - Каждый раз
        - Иногда
        - Один раз
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: Описание
      description: Что произошло.
      placeholder: "Например: после нажатия «Применить» ангар не меняется, а окно закрывается."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      description: Последовательность действий, после которой появляется ошибка. Если она неизвестна, опишите, что вы делали перед этим.
      placeholder: |
        1. Открыть мод
        2. Перейти на вкладку «Избранное»
        3. Выбрать ангар
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      placeholder: "Ангар сменился, окно осталось открытым."

  - type: textarea
    id: log
    attributes:
      label: Лог игры
      description: Перетащите в это поле файл `python.log` из корня папки с игрой. Приложите его сразу после ошибки, не запуская игру повторно.
      placeholder: Перетащите python.log сюда

  - type: textarea
    id: media
    attributes:
      label: Скриншоты или видео
      description: Если ошибку видно на экране, приложите изображение или запись.

  - type: input
    id: mod-version
    attributes:
      label: Версия мода
      description: Указана в названии файла мода.
      placeholder: "1.0 OBT"
    validations:
      required: true

  - type: input
    id: game-version
    attributes:
      label: Версия игры
      placeholder: "1.45.0.0"
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Другие установленные моды
      description: Часть ошибок возникает из-за конфликта с другими модификациями.
      placeholder: "openwg_gameface, FreeCam, модпак …"
